<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz List</title>
    <style>
        :root {
            --bg: #f4f2ed;
            --paper: #fffdf8;
            --ink: #1d2421;
            --muted: #5f6d66;
            --brand: #0f766e;
            --brand-strong: #115e59;
            --line: #d8ddd6;
            --glow: rgba(15, 118, 110, 0.16);
            --radius: 18px;
            --font-head: "Avenir Next", "Segoe UI", "Trebuchet MS", sans-serif;
            --font-body: "Source Sans Pro", "Helvetica Neue", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: var(--font-body);
            background:
                radial-gradient(circle at 10% 15%, rgba(15, 118, 110, 0.16), transparent 35%),
                radial-gradient(circle at 85% 0%, rgba(209, 157, 76, 0.16), transparent 40%),
                linear-gradient(160deg, #f6f4ef 0%, #eef2ee 55%, #e9f0ed 100%);
        }

        .page {
            width: min(1040px, 92vw);
            margin: 42px auto;
            animation: riseIn 520ms ease-out;
        }

        .hero {
            background: linear-gradient(135deg, rgba(255, 253, 248, 0.96), rgba(252, 255, 252, 0.88));
            border: 1px solid var(--line);
            border-radius: calc(var(--radius) + 6px);
            padding: 30px 28px;
            box-shadow: 0 18px 40px -22px rgba(11, 30, 25, 0.35);
            margin-bottom: 24px;
        }

        .eyebrow {
            margin: 0;
            color: var(--brand-strong);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.77rem;
            font-weight: 700;
        }

        h1 {
            margin: 10px 0 8px;
            font-family: var(--font-head);
            font-size: clamp(1.75rem, 3.6vw, 2.7rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .intro {
            margin: 0;
            max-width: 66ch;
            color: var(--muted);
            font-size: 1.02rem;
        }

        .quiz-grid {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .quiz-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: 0 14px 30px -26px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(10px);
            animation: cardIn 420ms ease forwards;
        }

        .quiz-card:nth-child(2) { animation-delay: 80ms; }
        .quiz-card:nth-child(3) { animation-delay: 140ms; }
        .quiz-card:nth-child(4) { animation-delay: 200ms; }
        .quiz-card:nth-child(n+5) { animation-delay: 260ms; }

        .quiz-link {
            display: block;
            color: inherit;
            text-decoration: none;
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 1.03rem;
            line-height: 1.3;
            border-radius: 12px;
            transition: transform 150ms ease, color 150ms ease;
        }

        .quiz-link:hover,
        .quiz-link:focus-visible {
            color: var(--brand-strong);
            outline: none;
            transform: translateX(2px);
        }

        .empty {
            background: var(--paper);
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            padding: 22px;
            color: var(--muted);
            text-align: center;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .page {
                width: min(1040px, 94vw);
                margin: 24px auto;
            }

            .hero {
                padding: 22px 18px;
            }

            .quiz-card {
                padding: 16px 14px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero" aria-labelledby="quiz-heading">
            <p class="eyebrow">Knowledge Center</p>
            <h1 id="quiz-heading">Available Quizzes</h1>
            <p class="intro">Pick a quiz and start immediately. Each quiz opens in a focused view with instant answer validation.</p>
        </section>

        <ul class="quiz-grid" aria-label="Quiz List">
            {{range .}}
            <li class="quiz-card">
                <a class="quiz-link" href="/quiz/{{.ID}}">{{.Title}}</a>
            </li>
            {{else}}
            <li class="empty">No quizzes found right now.</li>
            {{end}}
        </ul>
    </main>
</body>
</html>
